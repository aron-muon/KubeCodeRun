[package]
name = "preload"
version = "0.1.0"
edition = "2021"

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"

# Data formats
csv = "1.4.0"
zip = "9.0.3"
flate2 = "1.1.9"

# Spreadsheets: calamine is out until it supports zip 9 (every zip 7.x/8.x
# release is yanked; tafia/calamine#742). undoc below reads XLSX meanwhile.

# Office documents (DOCX, PPTX, XLSX)
undoc = "0.27.0"

# Markdown parsing
pulldown-cmark = "0.13.0"

# Images
image = "0.25.9"

# Utilities
uuid = { version = "1.21.0", features = ["v4", "serde"] }
chrono = { version = "0.4.43", features = ["serde"] }
regex = "1.12.3"
clap = { version = "4.5.59", features = ["derive"] }
anyhow = "1.0.101"
thiserror = "2.0.18"

# Math/Stats
nalgebra = "0.34.1"
statrs = "0.18.0"

# Plotting
plotters = "0.3.7"
